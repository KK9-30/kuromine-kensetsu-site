<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="黒峰建設株式会社">
  <meta property="og:description" content="橋梁・道路・公共施設施工">
  <meta property="og:type" content="website">
  <title>黒峰建設株式会社 | 橋梁・土木工事の専門企業</title>
  <link rel="icon" href="img/icon.jpg">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body class="contact-page">
  <header>
    <div class="header-inner">
      <h1 class="logo">
        <a href="index.html">
          <img src="img/logo.jpg" alt="黒峰建設株式会社">
        </a>
      </h1>
      <nav class="PC-menu">
        <ul class="menu">
          <li><a href="index.html">トップ</a></li>
          <li><a href="about.html">会社概要</a></li>
          <li><a href="projects.html">事業内容</a></li>
          <li><a href="news.html">お知らせ</a></li>
        </ul>
      </nav>
      <div class="header-right">
        <a href="contact.html" class="contact-btn">お問合せ</a>
        <div class="SP-menu">
          <span class="material-symbols-outlined" id="menu-open">
            menu
          </span>
          <div class="SP-overlay">
            <span class="material-symbols-outlined" id="menu-close">
              close
            </span>
            <nav class="SP-nav">
              <ul>
                <li><a href="index.html">トップ</a></li>
                <li><a href="about.html">会社概要</a></li>
                <li><a href="projects.html">事業内容</a></li>
                <li><a href="news.html">お知らせ</a></li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="pages">
    <h2 class="page-title">お問合せ</h2>
    <form class="contact-form">
      <label>
        <span class="label-text">
          お名前
          <span class="required" aria-label="必須">*</span>
        </span>
        <input type="text">
      </label>

      <div>
        <label>
          <span class="label-text">
            お問合せ種別
            <span class="required" aria-label="必須">*</span>
          </span>
          <select>
            <option>--選択してください--</option>
            <option>求人</option>
            <option>一般</option>
            <option>その他</option>
          </select>
        </label>
      </div>

      <label>
        <span class="label-text">
          メールアドレス
          <span class="required" aria-label="必須">*</span>
        </span>
        <input type="text">
      </label>

      <label>
        電話番号
        <input type="text">
      </label>

      <label>
        <span class="label-text">
          お問合せ内容
          <span class="required" aria-label="必須">*</span>
        </span>
        <textarea></textarea>
      </label>
      <div class="submit">
        <button class="more"><a href="thanks.html">送信</a></button>
        <p>＊このフォームはダミーです。実際には送信されません。</p>
      </div>

    </form>
  </div>

  <footer>
    <img src="img/logo.jpg" alt="黒峰建設株式会社">
    <nav>
      <ul class="menu">
        <li><a href="index.html">トップ</a></li>
        <li><a href="about.html">会社概要</a></li>
        <li><a href="projects.html">事業内容</a></li>
        <li><a href="news.html">お知らせ</a></li>
        <li><a href="contact.html">お問合せ</a></li>
      </ul>
    </nav>
    <p class="adress">〒000-0000
      <br>東京都XX区3丁目1-2-3 スカイビル6F
    </p>
    <p class="copyright">©2026黒峰建設</p>
  </footer>
  <script src="main.js"></script>
</body>

</html>
